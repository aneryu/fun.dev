<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffd43b">
    <link rel="stylesheet" href="/console.css">
    <script type="module" src="/console.js"></script>
    <title>fun.dev console</title>
  </head>
  <body>
    <header class="bar">
      <h1>fun.dev <span>console</span></h1>
      <p class="muted" id="who"></p>
    </header>
    <nav class="tabs" aria-label="后台">
      <button class="tab" type="button" id="tab-review" aria-pressed="true">审核</button>
      <button class="tab" type="button" id="tab-upload" aria-pressed="false">上传</button>
    </nav>
    <main>
      <section id="list-view" aria-labelledby="list-title">
        <div class="heading">
          <h2 id="list-title">模型审核</h2>
          <label class="filter">状态
            <select id="filter">
              <option value="pending">待审</option>
              <option value="rejected">已退回</option>
              <option value="approved">已通过</option>
              <option value="incomplete">未传完</option>
              <option value="all">全部</option>
            </select>
          </label>
        </div>
        <p class="muted" id="list-status" role="status" aria-live="polite"></p>
        <div class="bulk" id="bulk" hidden>
          <label class="check"><input type="checkbox" id="select-all"> 全选</label>
          <button class="button" type="button" id="approve-selected" disabled>通过选中的 0 个</button>
        </div>
        <ul class="rows" id="rows"></ul>
      </section>

      <section id="upload-view" aria-labelledby="upload-title" hidden>
        <h2 id="upload-title">上传模型</h2>
        <p class="muted">每个版本是一个 <code>&lt;id&gt;/&lt;version&gt;/</code> 文件夹，里面有 meta.json、model.glb、preview.png，可选 source.blend、qa.json 等。规则见 docs/models-upload.md。</p>
        <div class="pickers">
          <label class="button secondary picker">选择 zip（可多个）<input type="file" id="zip-input" accept=".zip,application/zip" multiple></label>
          <label class="button secondary picker">或选择文件夹<input type="file" id="folder-input" webkitdirectory multiple></label>
        </div>
        <p class="muted" id="upload-status" role="status" aria-live="polite"></p>
        <ul class="checks" id="upload-rows"></ul>
        <button class="button" type="button" id="upload-start" hidden>上传</button>
      </section>

      <section id="detail-view" aria-labelledby="detail-title" hidden>
        <button class="link" type="button" id="back">← 列表</button>
        <h2 id="detail-title"></h2>
        <p class="muted" id="detail-status" role="status" aria-live="polite"></p>
        <div class="detail">
          <div class="stage" id="stage"></div>
          <div class="facts">
            <dl id="stats"></dl>
            <ul class="warnings" id="warnings"></ul>
            <p class="note" id="note" hidden></p>
            <h3>文件</h3>
            <ul class="files" id="files"></ul>
          </div>
        </div>

        <form id="edit" class="panel">
          <h3>模型信息（所有版本共用）</h3>
          <label>中文名<input name="zh" required maxlength="100"></label>
          <label>英文名<input name="en" required maxlength="100"></label>
          <label>类别 type
            <select name="type" required>
              <option value="">（未填）</option>
              <option value="prop">prop 道具</option>
              <option value="piece">piece 模块化构件</option>
            </select>
          </label>
          <label>套件 kit<input name="kit" maxlength="64" pattern="[a-z0-9]+(_[a-z0-9]+)*" placeholder="可空"></label>
          <label>标签（逗号分隔）<input name="tags" placeholder="chair, indoor"></label>
          <label class="check"><input type="checkbox" name="listed"> 在 /models 上公开</label>
          <button class="button secondary" type="submit">保存信息</button>
        </form>

        <div class="panel" id="review">
          <h3>审核 <span id="review-version"></span></h3>
          <button class="button" type="button" id="approve">通过并发布</button>
          <label>退回原因<textarea id="reject-note" rows="3" maxlength="2000" placeholder="生产线通过接口能看到"></textarea></label>
          <button class="button danger" type="button" id="reject">退回</button>
        </div>

        <div class="panel">
          <h3>版本</h3>
          <ul class="versions" id="versions"></ul>
        </div>
      </section>
    </main>
  </body>
</html>
