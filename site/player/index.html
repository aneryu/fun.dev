<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffd43b">
    <!-- game-meta -->
    <script src="/progress/link-entry.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="/i18n-boot.js"></script>
    <link rel="stylesheet" href="/platform.css">
    <link rel="stylesheet" href="/player/player.css">
    <script type="module" src="/player/player.js"></script>
    <title>开玩 — fun.dev</title>
  </head>
  <body class="player-page">
    <!-- One menu on every screen: the game's controls, the language and the header (site link,
         back link, title), which moves into it; the game fills the viewport. -->
    <button class="player-menu-toggle" id="menu-toggle" type="button" aria-haspopup="dialog" aria-controls="controls-dialog" aria-label="游戏菜单" data-i18n-aria="menu"><span aria-hidden="true">☰</span></button>
    <dialog id="controls-dialog" class="controls-dialog" aria-labelledby="controls-title">
      <div class="controls-heading"><h2 id="controls-title" data-i18n="controls">游戏控制</h2><select class="language-toggle" id="language-toggle" aria-label="语言" data-i18n-aria="language"><option value="auto" data-i18n="languageAuto">自动</option><option value="zh" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select><button id="close-controls" class="close-controls" type="button" autofocus aria-label="关闭菜单" data-i18n-aria="closeMenu">×</button></div>
      <div class="player-controls" id="player-controls">
        <div class="player-actions" aria-label="游戏控制" data-i18n-aria="controls">
          <button class="button" id="restart" type="button" data-i18n="restart" disabled>重开</button>
          <button class="button" id="fullscreen" type="button" data-i18n="fullscreen" hidden>全屏</button>
          <button class="button" id="open-progress" type="button" data-open-progress data-i18n="myProgress" disabled>我的进度</button>
          <button class="button" id="open-options" type="button" data-i18n="options" disabled>选项</button>
          <button class="button" id="share" type="button" data-i18n="share" disabled>分享</button>
          <button class="button" id="record" type="button" hidden>录制视频</button>
        </div>
      </div>
    </dialog>
    <!-- Shown while recording. Platform controls are outside the game canvas, so the video never shows them. -->
    <button class="record-stop" id="record-stop" type="button" hidden><span class="record-dot" aria-hidden="true"></span><span id="record-time" aria-hidden="true">0:00</span><span data-i18n="stop" aria-hidden="true">停止</span></button>
    <header class="player-header">
      <a class="wordmark" href="/" data-language-link>fun.dev</a>
      <a class="back-link" href="/games" data-language-link data-i18n="back">← 游戏</a>
      <h1 id="game-title">开玩</h1>
    </header>
    <main class="player-main" id="player">
      <div class="game-stage" id="game-stage" aria-label="游戏区域" data-i18n-aria="gameArea"></div>
      <p class="action-toast" id="action-status" role="status" aria-live="polite"></p>
      <div class="player-message" id="player-message" role="status" aria-live="polite">
        <p id="player-status" data-i18n="loading">加载中…</p>
        <progress id="player-loading" max="1" aria-label="加载进度" data-i18n-aria="loadingProgress" hidden></progress>
        <button class="button" id="resume" type="button" data-i18n="resume" hidden>继续</button>
        <button class="button" id="open-progress-message" type="button" data-open-progress data-i18n="myProgress" hidden>我的进度</button>
        <a id="error-back" href="/games" data-language-link data-i18n="errorBack" hidden>返回游戏</a>
        <noscript><p>请开启 JavaScript。<br><span lang="en">Please enable JavaScript.</span></p></noscript>
      </div>
    </main>
    <dialog id="options-dialog" class="options-dialog" aria-labelledby="options-title">
      <div class="controls-heading"><h2 id="options-title" data-i18n="options">选项</h2><button id="close-options" class="close-controls" type="button" aria-label="关闭选项" data-i18n-aria="closeOptions">×</button></div>
      <section id="how-to-play" hidden><h3 data-i18n="howToPlay">怎么玩</h3><p id="how-to-play-text"></p></section>
      <fieldset class="option-group"><legend data-i18n="soundHaptics">声音与震动</legend>
        <label class="option-row"><input type="checkbox" id="pref-mute"><span data-i18n="mute">静音</span></label>
        <label class="option-row option-range"><span data-i18n="volume">音量</span><input type="range" id="pref-volume" min="0" max="1" step="0.05"></label>
        <label class="option-row"><input type="checkbox" id="pref-haptics"><span data-i18n="haptics">震动反馈</span></label>
      </fieldset>
      <fieldset class="option-group" id="options-settings" hidden><legend data-i18n="settings">设置</legend><div class="option-list"></div></fieldset>
      <fieldset class="option-group" id="options-cheats" hidden><legend data-i18n="cheats">秘籍</legend><div class="option-list"></div></fieldset>
      <fieldset class="option-group" id="options-debug" hidden><legend data-i18n="debugOptions">调试</legend><div class="option-list"></div></fieldset>
    </dialog>
    <dialog id="record-dialog" class="options-dialog record-dialog" aria-labelledby="record-title">
      <div class="controls-heading"><h2 id="record-title" data-i18n="recordDone">录好了</h2><button id="close-record" class="close-controls" type="button" aria-label="不要了" data-i18n-aria="recordDiscard">×</button></div>
      <video id="record-video" class="record-video" controls playsinline loop></video>
      <p id="record-note" class="record-note"></p>
      <div class="progress-buttons">
        <button class="button" id="record-share" type="button" data-i18n="recordShare" hidden>分享视频</button>
        <a class="button" id="record-save" data-i18n="recordSave">保存视频</a>
        <button class="button" id="record-discard" type="button" data-i18n="recordDiscard">不要了</button>
      </div>
    </dialog>
    <div id="game-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
    <div class="safe-area-probe" aria-hidden="true"></div>
    <pre id="debug-panel" class="debug-panel" aria-hidden="true" hidden></pre>
    <script src="/i18n-boot.js"></script>
  </body>
</html>
