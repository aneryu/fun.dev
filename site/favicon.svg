<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="badge-clip">
      <rect x="3" y="3" width="58" height="58" rx="15"/>
    </clipPath>
  </defs>

  <!-- Warm Ceramic Cream Squircle Background -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#FFF7D6"/>

  <!-- Bright Bath Water Pool (clipped to squircle) -->
  <g clip-path="url(#badge-clip)">
    <path d="M0 40 Q16 36 32 40 T64 39 L64 64 L0 64 Z" fill="#4BA3C7"/>
    <path d="M0 49 Q20 45 36 49 T64 48 L64 64 L0 64 Z" fill="#064F67" opacity="0.22"/>
  </g>

  <!-- Plump Rubber Duck Body & Upturned Tail -->
  <path
    d="M15 42 C13 34, 20 30, 29 31 C36 31, 42 29, 48 24 C51 29, 51 40, 45 45 C38 49, 21 49, 15 42 Z"
    fill="#FFD43B"
    stroke="#211F17"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Cute Head Tuft & Round Duck Head -->
  <path
    d="M28 12 C30 8, 35 9, 33 13"
    fill="none"
    stroke="#211F17"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle
    cx="27"
    cy="23.5"
    r="11.5"
    fill="#FFD43B"
    stroke="#211F17"
    stroke-width="3"
  />

  <!-- Seamless Neck Join -->
  <path d="M19 29.5 Q27 34.5 35.5 29.5 L36.5 37 L18 37 Z" fill="#FFD43B"/>

  <!-- Folded Wing -->
  <path
    d="M28 36.5 C33 33.5, 41 34.5, 42 39.5 C40 43.5, 32 43.5, 28 39.5 Z"
    fill="#F28C28"
    fill-opacity="0.32"
    stroke="#211F17"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Plump Orange Beak -->
  <ellipse
    cx="14.5"
    cy="25.5"
    rx="6.8"
    ry="3.8"
    fill="#F28C28"
    stroke="#211F17"
    stroke-width="2.6"
  />

  <!-- Glossy Eye with Specular Catchlight -->
  <circle cx="24.2" cy="21" r="2.9" fill="#211F17"/>
  <circle cx="23.2" cy="20" r="1.1" fill="#FFF7D6"/>

  <!-- Front Water Ripple Highlight -->
  <path
    d="M11 47 Q23 51 35 47 T53 47"
    fill="none"
    stroke="#FFF7D6"
    stroke-width="2.4"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Crisp Outer Squircle Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#211F17" stroke-width="3"/>
</svg>
