<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fun.dev — Code for fun</title>
    <meta
      name="description"
      content="fun.dev: Code for fun, not work. A playful WebGPU 3D Signed Distance Field (SDF) corner of the internet."
    >
    <meta property="og:title" content="fun.dev — Code for fun">
    <meta
      property="og:description"
      content="Code for fun, not work. A playful WebGPU 3D Signed Distance Field (SDF) corner of the internet."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fun.dev/">
    <meta name="theme-color" content="#FFD43B">
    <link rel="canonical" href="https://fun.dev/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <noscript><style>.poster-fallback[hidden]{display:flex!important}</style></noscript>
  </head>
  <body>
    <header class="top-bar">
      <a class="wordmark" href="/">fun.dev</a>
      <div class="top-controls">
        <a
          id="open-studio-link"
          class="wordmark studio-link-btn"
          href="/studio?scene=bath-duck"
          data-i18n="openStudio"
        >Studio ↗</a>
      </div>
    </header>

    <main class="playground-shell">
      <div class="playground-grid">
        <section class="hero-column" aria-label="Identity" data-i18n-aria="ariaHero">
          <h1 class="diff">
            <span class="diff-line">Code for</span>
            <del class="diff-line diff-remove">work.</del>
            <ins class="diff-line diff-add">fun.</ins>
          </h1>
          <p class="intro" data-i18n="intro">Things I make for fun.</p>
        </section>

        <section class="stage-column" aria-label="3D Interactive Stage" data-i18n-aria="ariaStage">
          <div class="stage-viewport">
            <canvas id="sdf-canvas" tabindex="0" aria-label="Interactive 3D Bath Duck Canvas" data-i18n-aria="ariaCanvas"></canvas>
            <div id="poster-fallback" class="poster-fallback" hidden>
              <svg class="poster-svg" viewBox="0 0 360 320" role="img" aria-label="Rubber duck illustration" data-i18n-aria="ariaPoster">
                <ellipse cx="180" cy="272" rx="118" ry="20" fill="#211F17" opacity="0.14"/>
                <path
                  d="M95 215 C82 175, 118 145, 165 148 C192 150, 224 138, 250 155 C278 172, 275 225, 242 248 C205 268, 115 262, 95 215 Z"
                  fill="#FFD43B"
                  stroke="#211F17"
                  stroke-width="6"
                />
                <circle cx="152" cy="112" r="46" fill="#FFD43B" stroke="#211F17" stroke-width="6"/>
                <path
                  d="M148 68 C154 50, 174 52, 166 70"
                  fill="none"
                  stroke="#211F17"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <ellipse cx="110" cy="118" rx="24" ry="12" fill="#F28C28" stroke="#211F17" stroke-width="5"/>
                <circle cx="140" cy="102" r="6.5" fill="#211F17"/>
                <circle cx="138" cy="100" r="2.2" fill="#FFF7D6"/>
                <path
                  d="M155 188 C178 176, 212 184, 218 206 C210 222, 174 224, 155 208 Z"
                  fill="#FFD43B"
                  stroke="#211F17"
                  stroke-width="5"
                />
              </svg>
              <p id="poster-message" class="poster-message" data-i18n="unsupported">
                WebGPU is unavailable in this browser; showing the static rubber duck poster.
              </p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/home.js"></script>
  </body>
</html>
